<html lang="ko">
<head>

<title>SOROCI 현장 가이드 | Beautyworld Middle East 2026</title>

<style>
:root{
  --ink:#22302B;
  --ink-soft:#5A6B63;
  --line:#E6EAE7;
  --bg:#FFFFFF;
  --card:#F7F9F8;
  --accent:#3E5F52;
  --accent-soft:#EAF1EE;
  --rice:#A98F5F;   --rice-bg:#F6F1E7;
  --drizzle:#4C74A0; --drizzle-bg:#EBF1F7;
  --tang:#D97E2E;   --tang-bg:#FBF0E3;
  --marine:#2E7D8A; --marine-bg:#E7F2F4;
  --derma:#4E7D52;  --derma-bg:#EAF3EB;
  --danger:#B4552F;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.6;
  padding-bottom:76px;
}
.serif{font-family:"Gowun Batang",serif}
header{
  position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  padding:14px 20px 12px;
}
header .brand{font-family:"Gowun Batang",serif;font-weight:700;font-size:1.15rem;letter-spacing:.14em}
header .tagline{font-size:.72rem;color:var(--ink-soft);letter-spacing:.06em;margin-top:1px}
main{max-width:560px;margin:0 auto;padding:20px 18px 32px}
.page{display:none;animation:fade .25s ease}
.page.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.page{animation:none}}

h2.sec{font-family:"Gowun Batang",serif;font-size:1.3rem;font-weight:700;margin:26px 0 6px}
h2.sec:first-child{margin-top:4px}
p.sub{font-size:.85rem;color:var(--ink-soft);margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.card h3{font-size:.98rem;margin-bottom:6px}
.card p{font-size:.88rem;color:var(--ink-soft)}
.en{font-family:"Gowun Batang",serif;font-size:.95rem;line-height:1.55;color:var(--ink);
  background:var(--accent-soft);border-left:3px solid var(--accent);
  padding:10px 12px;border-radius:0 10px 10px 0;margin:8px 0}
.kr{font-size:.85rem;color:var(--ink-soft)}
.chip{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.04em;
  padding:2px 9px;border-radius:99px;vertical-align:middle}
.must{background:var(--accent);color:#fff}
.info{background:var(--accent-soft);color:var(--accent)}
.note{background:#FFF7EC;border:1px solid #F0DFC3;border-radius:10px;
  padding:10px 12px;font-size:.82rem;color:#7A5A28;margin-top:8px}
.note b{font-weight:700}

/* accordion */
.acc{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden;background:#fff}
.acc>button{width:100%;text-align:left;background:none;border:0;cursor:pointer;
  padding:14px 44px 14px 14px;font-size:.95rem;font-weight:600;color:var(--ink);
  position:relative;font-family:inherit;line-height:1.45}
.acc>button::after{content:"▾";position:absolute;right:14px;top:50%;transform:translateY(-50%);
  color:var(--ink-soft);transition:transform .2s}
.acc.open>button::after{transform:translateY(-50%) rotate(180deg)}
.acc .body{display:none;padding:0 14px 14px;font-size:.87rem}
.acc.open .body{display:block}

/* line color helpers */
.l-rice{--lc:var(--rice);--lb:var(--rice-bg)}
.l-drizzle{--lc:var(--drizzle);--lb:var(--drizzle-bg)}
.l-tang{--lc:var(--tang);--lb:var(--tang-bg)}
.l-marine{--lc:var(--marine);--lb:var(--marine-bg)}
.l-derma{--lc:var(--derma);--lb:var(--derma-bg)}
.line-chip{display:inline-block;font-size:.7rem;font-weight:700;padding:2px 9px;
  border-radius:99px;background:var(--lb);color:var(--lc);margin-right:6px}
.acc.line>button{border-left:4px solid var(--lc)}
.sku{padding:10px 0;border-top:1px dashed var(--line)}
.sku:first-of-type{border-top:0}
.sku .nm{font-weight:600;font-size:.9rem}
.sku .tag{font-size:.66rem;font-weight:700;color:#fff;background:var(--lc);
  border-radius:5px;padding:1px 6px;margin-left:5px;vertical-align:1px}
.sku .ds{font-size:.82rem;color:var(--ink-soft);margin-top:2px}

/* home journey */
.journey{display:flex;flex-direction:column;gap:10px;margin:14px 0 4px}
.stage{display:flex;gap:14px;align-items:flex-start;background:var(--card);
  border:1px solid var(--line);border-radius:14px;padding:14px}
.stage .no{font-family:"Gowun Batang",serif;font-size:1.5rem;font-weight:700;color:var(--accent);
  line-height:1.2;min-width:30px}
.stage h3{font-size:.95rem}
.stage p{font-size:.83rem;color:var(--ink-soft);margin-top:2px}
.stage .go{margin-top:8px;display:inline-block;font-size:.8rem;font-weight:700;color:var(--accent);
  background:var(--accent-soft);border:0;border-radius:8px;padding:6px 12px;cursor:pointer;font-family:inherit}

/* pillars */
.pillars{display:flex;flex-direction:column;gap:10px}
.pillar{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}
.pillar .ico{font-size:1.3rem}
.pillar h3{font-size:.95rem;margin:4px 0 2px}

/* flow steps */
.step .lbl{font-size:.72rem;font-weight:700;color:var(--accent);letter-spacing:.06em}

/* rehearsal */
.qcard{border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;
  background:#fff;cursor:pointer;user-select:none}
.qcard .q{font-family:"Gowun Batang",serif;font-size:1rem;line-height:1.5}
.qcard .hint{font-size:.75rem;color:var(--ink-soft);margin-top:8px}
.qcard .ans{display:none;margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}
.qcard.open .ans{display:block}
.qcard.open .hint{display:none}
.toolbar{display:flex;gap:8px;margin-bottom:14px}
.toolbar button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;
  padding:9px 0;font-size:.83rem;font-weight:600;color:var(--ink);cursor:pointer;font-family:inherit}

/* expo table */
.kv{width:100%;border-collapse:collapse;font-size:.87rem}
.kv td{padding:8px 0;border-bottom:1px solid var(--line);vertical-align:top}
.kv td:first-child{color:var(--ink-soft);width:34%}
.kv tr:last-child td{border-bottom:0}
.tbd{color:var(--danger);font-weight:700}

/* checklist */
.ck{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:.88rem}
.ck:last-child{border-bottom:0}
.ck input{margin-top:4px;accent-color:var(--accent);width:16px;height:16px}
.ck label{flex:1}
.ck input:checked + label{color:var(--ink-soft);text-decoration:line-through}

/* bottom nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;
  border-top:1px solid var(--line);display:flex;
  padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:9px 0 8px;cursor:pointer;
  font-family:inherit;color:var(--ink-soft);font-size:.68rem;font-weight:600;
  display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .dot{width:5px;height:5px;border-radius:99px;background:transparent}
nav button.on{color:var(--accent)}
nav button.on .dot{background:var(--accent)}
nav button .t{font-size:1.05rem;line-height:1}
footer{max-width:560px;margin:0 auto;padding:0 18px 24px;font-size:.72rem;color:var(--ink-soft)}
</style>
</head>

  <h2 class="sec">현장 팁</h2>
  <div class="card">
    <div class="sku"><div class="nm">명함은 즉시 메모 📝</div><div class="ds">받는 즉시 상대의 특징·대화 내용을 짧게라도 적기. 나중엔 기억이 안 납니다.</div></div>
    <div class="sku"><div class="nm">식사 및 자리 비움 🍱</div><div class="ds">바이어가 언제 올지 모르니 교대로 부스 안쪽에서 간단히 식사.</div></div>
    <div class="sku"><div class="nm">단가·MOQ 대응 원칙</div><div class="ds">바이어가 먼저 물을 때만 답합니다. 구체 조건은 "전시 후 제안서 발송"으로 클로징.</div></div>
    <div class="sku"><div class="nm">가이드 활용법 🎯</div><div class="ds">이 가이드는 참고용입니다. 핵심만 짚고 본인 스타일로 자연스럽게 응대해 주세요. 파이팅!</div></div>
  </div>`;
}

const PAGES = {home:pageHome, learn:pageLearn, memo:pageMemo, drill:pageDrill, prod:pageProd, field:pageField};
let current = "home";

function render(id){
  current = id;
  $("#app").innerHTML = `<div class="page on">${PAGES[id]()}</div>`;
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on", b.dataset.tab===id));
  window.scrollTo({top:0});
  bind();
}

function bind(){
  document.querySelectorAll(".acc>button").forEach(b=>{
    b.onclick = ()=> b.parentElement.classList.toggle("open");
  });
  document.querySelectorAll("[data-go]").forEach(b=>{
    b.onclick = ()=> render(b.dataset.go);
  });
  document.querySelectorAll("[data-q]").forEach(c=>{
    c.onclick = ()=> c.classList.toggle("open");
  });
  const sh = $("#shuffleBtn");
  if(sh) sh.onclick = ()=>{
    for(let i=drillOrder.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[drillOrder[i],drillOrder[j]]=[drillOrder[j],drillOrder[i]];}
    render("drill");
  };
  const rs = $("#resetBtn");
  if(rs) rs.onclick = ()=> document.querySelectorAll("[data-q]").forEach(c=>c.classList.remove("open"));
}

$("#nav").innerHTML = TABS.map(t=>
  `<button data-tab="${t.id}"><span class="t">${t.ico}</span>${t.label}<span class="dot"></span></button>`).join("");
document.querySelectorAll("nav button").forEach(b=> b.onclick = ()=> render(b.dataset.tab));
$("#ver").textContent = "SOROCI 현장 가이드 · " + EXPO.version;
render("home");
</script>
</body>
</html>
